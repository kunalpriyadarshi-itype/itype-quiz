*{

body{

font-size:16px;

}

.option:hover{
transform:translateY(-2px);

}

.option.correct{
background:linear-gradient(135deg,rgba(0,255,128,0.25),rgba(0,255,128,0.12));

}

.option.wrong{
background:linear-gradient(135deg,rgba(255,0,80,0.25),rgba(255,0,80,0.12));
border-color:#ff3b6b;
}

.buttons{
display:flex;
gap:20px;
margin-top:40px;

button{
flex:1;
padding:18px;
border:none;
border-radius:18px;

font-size:16px;
font-weight:700;

button:hover{

font-size:15px;

@keyframes marqueeMove{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-100%);
}

let currentQuestion = 0;
let score = 0;
let answeredQuestions = {};

function loadQuestion(){

const q = questions[currentQuestion];

let category = "";

if(currentQuestion <= 14){
category = "🎨 Designer Round";
}
else if(currentQuestion <= 33){
category = "💻 Developer Round";
}
else{
category = "📈 Sales & Execution Round";
}

document.getElementById("question-number").innerHTML =
`Question ${currentQuestion + 1}
<span style="font-size:14px;color:#9ddcff;display:block;margin-top:6px;">
${category}
</span>`;

document.getElementById("progress").innerText =
`${currentQuestion + 1} / ${questions.length}`;

document.getElementById("question").innerText =
q.question;

const optionsContainer =
document.getElementById("options");

optionsContainer.innerHTML = "";

q.options.forEach((option,index)=>{

const div = document.createElement("div");

div.classList.add("option");

div.innerHTML =
`<strong>${String.fromCharCode(65 + index)}.</strong> ${option}`;

div.onclick = ()=>checkAnswer(div,index);

optionsContainer.appendChild(div);

});

}

function checkAnswer(selected,index){

if(answeredQuestions[currentQuestion] !== undefined){
return;
}

const correctAnswer = questions[currentQuestion].answer;

const allOptions = document.querySelectorAll(".option");

answeredQuestions[currentQuestion] = true;

allOptions.forEach(option=>{
option.style.pointerEvents = "none";
});

if(index === correctAnswer){

selected.classList.add("correct");
score++;

}else{

selected.classList.add("wrong");
allOptions[correctAnswer].classList.add("correct");

}

document.getElementById("score").innerText =
`Score: ${score} / ${questions.length}`;

}

function nextQuestion(){

if(currentQuestion < questions.length - 1){

currentQuestion++;
loadQuestion();

}

}

function startQuiz(){

document.getElementById("startScreen").remove();

document.getElementById("quizContainer")
.classList.remove("hidden");

loadQuestion();

}

function prevQuestion(){

if(currentQuestion > 0){

currentQuestion--;
loadQuestion();

}

}
